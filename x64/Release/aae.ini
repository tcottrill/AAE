;####AAE MAIN INI####

[input]
mouse_player1=-1
mouse_player2=-2
mouse_player3=-2
mouse_player4=-2
mouse_player1_path=
kbd_player1=-1
kbd_player1_path=
mouse_player2_path=
kbd_player2=-1
kbd_player2_path=
mouse_player3_path=
kbd_player3=-1
kbd_player3_path=
mouse_player4_path=
kbd_player4=-1
kbd_player4_path=
joy_player1=-1
joy_player2=-1
joy_player3=-1
joy_player4=-1
joy_player1_id=
joy_player2_id=
joy_player3_id=
joy_player4_id=

[main]
;mame_rom_path=e:\mame\roms
;mame_artwork_path=e:\mame\artwork

screenw=1024
screenh=768

hack=1
bezel=0
artwork=1
artcrop=1
overlay=1
snappng=1
force_vsync=0
doublebuffer=1
drawzero=0
samplerate=48000
speakers=2
surround_encode=1
linewidth=2.2
pointsize=1.5
gamma=127
bright=127
contrast=127
translucent=1
fire_point_size=20
explode_point_size=17
debug=0
kbleds=1
debug_profile_code=0
audio_force_resample=1
; --- Performance Settings ---
; Process priority: 0=IDLE, 1=NORMAL, 2=ABOVE_NORMAL, 3=HIGH, 4=REALTIME (not recommended)
priority=2
; Boost main game thread priority slightly above normal
; 1 = enable, 0 = disable
boostThread=1
raster_effect=NONE
;scanlines.png
;scanrez2.png

; Disable confirm_exit to exit without the confirmation for arcade cabinets.
confirm_exit=0

;Flip the GUI controls for cabinets with just right/left controls.
flip_gui_controls=0

; --- System rotation ---
; Rotates everything (GUI and games) at display time. Composes with each
; game's built-in cabinet rotation via XOR, MAME-style.
;   0 = none (default)
;   5 = rotate 90 deg clockwise   (same as command line -ror)
;   3 = rotate 180 deg            (no command-line equivalent)
;   6 = rotate 90 deg counter-cw  (same as command line -rol)
; Command-line -ror / -rol / -norotate override this value when present.
system_rotation=0

; UI hotkey bindings (Cancel, Reset Machine, Open Menu, Toggle FPS,
; Snapshot, menu navigation, etc.) are rebindable through the in-game
; KEY CONFIG (GLOBAL) menu and persist to default.cfg alongside game
; inputs. Not configured in this INI.
;
; The following INI keys were removed in the 2026-05-29 cleanup pass
; because nothing in the codebase reads them:
;   kquit, kpause, ksnap, klstate, ksstate, ktest, kmenu  (dead UI keys)
;   dotmask, accumlevel, screenburn, sstick               (dead [main] keys)
;   monitor                                               (use starting_monitor)
;   mouse1xs/ys, mouse2xs/ys, mouse1x_invert, mouse1y_invert,
;   mouse1b1, [mouse] mouse_accel_factor                  (dead trackball/spinner)


########### SOUND OPTIONS ###############

hvnoise=0
pshiss=0
psnoise=0

mainvol=255
pokeyvol=255
noisevol=26

###########################
anisfilter=0
prescale=2.0
vectorglow=7
vectortrail=0
gain=20
m_line=23
m_point=13

widescreen=0
line_smoothing=1.000000
corner_strength=0.850000
shots_textured=1

game_aspect=AUTO

[monitorcolor]
color_enable=1
color_blur_h=0.250000
color_blur_v=0.100000
color_converge=0.150000
color_halation=0.060000
color_halation_radius=4.000000
color_scanline=0.500000
color_contrast=1.000000
color_brightness=0.000000
color_saturation=1.150000
color_mask_type=1
color_mask_strength=0.100000
color_mask_scale=2.000000

[monitormono]
mono_enable=1
mono_blur_h=0.150000
mono_blur_v=0.150000
mono_halation=0.160000
mono_halation_radius=4.000000
mono_scanline=0.000000
mono_contrast=1.000000
mono_brightness=0.000000
mono_tint=0

[window]
fullscreen=0
center=1
use_aspect=0
aspect_ratio=4:3
disable_nc=1
disable_rounded_corners=false
width=1024
height=768
dpi_aware=true
cursor_clip=0

