;####AAE MAIN INI####

[input]
mouse_player1=-1
mouse_player2=-2
mouse_player3=-2
mouse_player4=-2
mouse_player1_path=
kbd_player1=-1
kbd_player1_path=
mouse_player2_path=
kbd_player2=-1
kbd_player2_path=
mouse_player3_path=
kbd_player3=-1
kbd_player3_path=
mouse_player4_path=
kbd_player4=-1
kbd_player4_path=
joy_player1=-1
joy_player2=-1
joy_player3=-1
joy_player4=-1
joy_player1_id=
joy_player2_id=
joy_player3_id=
joy_player4_id=

[main]
;mame_rom_path=e:\mame\roms
;mame_artwork_path=e:\mame\artwork
; Graphics backend: vulkan (default) or opengl. Read once at startup - no
; runtime switching. Also settable in the VIDEO SETUP menu (applies next run)
; and overridable for one launch with:  aae <game> -renderer opengl
; If Vulkan fails to initialise, AAE falls back to OpenGL automatically.
renderer=vulkan
; Vulkan vector beam buffer: 1 = 1024x1024 (default, matches the OpenGL
; chain), 2 = 2048x2048 supersampled - visibly smoother beams, but 4x the
; fill and a 4x larger per-frame mip cascade. Read at startup; takes effect
; on the next launch. The log line "vector post chain online (beam RT NxN)"
; confirms which one you got.
vk_ssaa=1
; Vulkan GPU profiler: 1 = time each pass of the frame with GPU timestamps
; and write a per-section summary (average ms and % of frame) to
; systemlog.txt every 120 frames. Diagnostic only - leave at 0 for normal
; play; when 0 nothing at all is recorded. Takes effect at the next launch.
;vk_profile=0
; Vulkan validation layer: writes "VK-validation: ..." lines to systemlog.txt.
; Needs VK_LAYER_KHRONOS_validation (Vulkan SDK) installed; logs a one-line
; notice and carries on without it. Diagnostic only - leave at 0 for play.
vk_validation=0
screenw=0
screenh=0
hack=1
bezel=0
artwork=1
artcrop=1
overlay=1
snappng=1
force_vsync=0
doublebuffer=1
drawzero=0
samplerate=48000
speakers=2
surround_encode=1
linewidth=2.2
pointsize=1.5
prescale=2
gamma=127
bright=127
contrast=127
translucent=1
fire_point_size=20
explode_point_size=17
debug=0
kbleds=1
debug_profile_code=0
audio_force_resample=1
priority=2
boostThread=1
raster_effect=NONE
;scanlines.png
;scanrez2.png

; Disable confirm_exit to exit without the confirmation for arcade cabinets.
confirm_exit=0

;Flip the GUI controls for cabinets with just right/left controls.
flip_gui_controls=0
system_rotation=0
hvnoise=0
pshiss=0
psnoise=0

mainvol=255
pokeyvol=255
noisevol=26
anisfilter=0
vectorglow=7
; glow_filter: 0 = classic 8-pass accumulate blur, 1 = dual-filter pyramid.
; The glow2_* keys below only apply when glow_filter=1. Both renderers, and
; all five are live-adjustable from the VECTOR MONITOR SETUP menu.
glow_filter=1
; Overall glow brightness. The pyramid is energy-preserving, so this is
; deliberately large - it saturates the core like the classic blur does.
glow2_gain=10.0
; Tap radius inside every pyramid level. Widens/tightens the whole halo.
glow2_spread=1.0
; Mid-level detail re-injected during upsampling - the body of the tail.
glow2_tail=0.6
; Unblurred source added in the final pass - hardness of the hot core.
glow2_core=1.0
vectortrail=0
gain=20
m_line=23
m_point=13
widescreen=0
line_smoothing=1.000000
corner_strength=0.850000
shots_textured=1

game_aspect=AUTO

[monitorcolor]
color_enable=1
color_blur_h=0.250000
color_blur_v=0.100000
color_converge=0.150000
color_halation=0.060000
color_halation_radius=4.000000
color_scanline=0.500000
color_contrast=1.000000
color_brightness=0.000000
color_saturation=1.150000
color_mask_type=1
color_mask_strength=0.100000
color_mask_scale=2.000000

[monitormono]
mono_enable=1
mono_blur_h=0.150000
mono_blur_v=0.150000
mono_halation=0.160000
mono_halation_radius=4.000000
mono_scanline=0.000000
mono_contrast=1.000000
mono_brightness=0.000000
mono_tint=0

[window]
fullscreen=0
center=1
use_aspect=0
aspect_ratio=4:3
disable_nc=1
disable_rounded_corners=false
dpi_aware=true
cursor_clip=0

