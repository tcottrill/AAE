# AAE Flatpak manifest.
#
# Build:
#   flatpak-builder --user --install --force-clean build-flatpak \
#       packaging/flatpak/io.github.tcottrill.AAE.yml
#
# Single-file bundle to carry to the Steam Machine:
#   flatpak-builder --user --repo=repo --force-clean build-flatpak \
#       packaging/flatpak/io.github.tcottrill.AAE.yml
#   flatpak build-bundle repo aae.flatpak io.github.tcottrill.AAE
#
# WHY FLATPAK RATHER THAN A TARBALL
#
# The binary cannot simply be copied to SteamOS. This repo builds against the
# host toolchain - glibc 2.43 on the Ubuntu 26.04 dev box - while SteamOS 3.x
# ships roughly 2.37, so a copied binary dies with "GLIBC_2.4x not found"
# before main(). Flatpak compiles the app INSIDE its own SDK, so the result
# depends only on the runtime, which is the same everywhere.
#
# NOTE ON REDISTRIBUTION: this bundles roms/, artwork/ and samples/ so the
# thing installs and runs in one step. That makes it a private sideload
# artefact - Flathub would not accept a package containing arcade ROMs. If
# this is ever published, the data modules below are what has to come out.

app-id: io.github.tcottrill.AAE
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: aae-launcher.sh

finish-args:
  # X11, not Wayland. Deliberate, and the reason the whole backend is X11+GLX:
  # gamescope hosts its own XWayland server and every game in the SteamOS
  # session runs inside it, taking frames with no copy inside X. X11 is the
  # paved road on this target, not a fallback.
  - --socket=x11
  - --share=ipc

  # GPU.
  - --device=dri

  # Audio. PulseAudio covers the PipeWire-with-pulse-compat setup SteamOS
  # uses; alsa_backend opens ALSA "default", which resolves to it.
  - --socket=pulseaudio

  # THE ONE THAT IS EASY TO MISS. Without --device=input the sandbox exposes
  # no /dev/input at all and the evdev backend correctly reports "no input
  # devices" - which reads as a broken build rather than a missing permission.
  # The user must also be in the 'input' group on the host; on SteamOS /etc is
  # a writable overlay under /var, so usermod -aG input survives OS updates
  # (worth re-checking after each one - rollbacks land in /etc/previous).
  - --device=input

  # Gamepads that present as /dev/uinput or hidraw, plus rumble.
  - --device=all

  # Read access for a rom/artwork collection kept outside the app's own data
  # directory, reached via aae.ini's mame_rom_path / mame_artwork_path.
  #
  # Files dropped into the data directory itself need NONE of this - the
  # launcher makes roms/, artwork/ and samples/ real writable directories, and
  # they sit in ordinary $HOME at
  #   ~/.var/app/io.github.tcottrill.AAE/data/aae/
  # These two exist for the other case: a large collection already living
  # somewhere else, which is how emulator flatpaks are normally used.
  #
  # :ro deliberately. AAE only ever READS roms and artwork; everything it
  # writes (hi/, cfg/, nv/, snap/, the ini and the log) goes to its data
  # directory. There is no reason to hand it write access to $HOME, and
  # /run/media covers the SD card and USB storage on SteamOS.
  - --filesystem=home:ro
  - --filesystem=/run/media:ro

  # ~/AAE is where roms/ and artwork/ are surfaced, so unlike the two above it
  # needs WRITE access - the launcher creates the folders and populates them
  # with links to the shipped payload. :create makes the directory if it is
  # not there yet, which is what turns "find the hidden data folder" into
  # "open /home/deck/AAE".
  #
  # Outside the app data directory on purpose: `flatpak uninstall --delete-data`
  # clears settings and saves for an ini format change without touching a rom
  # collection.
  - --filesystem=~/AAE:create

modules:
  # GLU is not in the Freedesktop runtime either, and two things need it:
  # glew.h #includes <GL/glu.h> unless the consumer defines GLEW_NO_GLU, and
  # AAE actually CALLS gluBuild2DMipmaps from sys_texture.cpp and
  # texture_handler.cpp on the legacy texture path - so defining that macro to
  # silence the include would only move the failure to link time.
  #
  # Must come BEFORE glew, which installs the header that includes it.
  #
  # Sourced from git by tag rather than a tarball, deliberately: a git tag
  # needs no sha256, and a hash written from memory is exactly how the glew
  # module wasted a build cycle earlier.
  - name: glu
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/mesa/glu.git
        tag: glu-9.0.3

  # GLEW is NOT part of the Freedesktop runtime, and the Linux build needs it:
  # the bundled copy in system/3rdparty has wglew.h but no glxew.h, so Linux
  # links the system library while Windows keeps the bundled one.
  #
  - name: glew
    buildsystem: simple
    build-commands:
      - make GLEW_PREFIX=/app GLEW_DEST=/app LIBDIR=/app/lib -j${FLATPAK_BUILDER_N_JOBS}
      - make install GLEW_PREFIX=/app GLEW_DEST=/app LIBDIR=/app/lib
    sources:
      - type: archive
        url: https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.tgz
        sha256: d4fc82893cfb00109578d0a1a2337fb8ca335b3ceccf97b97e5cc7f08e4353e1

  - name: aae
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
        # The working tree is ~2.4GB and almost none of it is source. Without
        # these skips flatpak-builder copies the lot into the build sandbox on
        # every run: 462MB of build output, 161MB of backups, 120MB of stuff/,
        # 115MB of packages/, a 75MB cc65 toolchain and a 72MB .git.
        #
        # x64 is skipped here even though CMakeLists writes the executable into
        # x64/Release - that directory is CREATED by the build. The game data
        # that normally lives there is handled by the aae-data module below.
        skip:
          - .git
          - .vs
          - backup
          - stuff
          - packages
          - cc65-win32
          - build-linux
          - build-cmake
          - build-flatpak
          - flatpak-repo
          - x64
          # The MSBuild output trees. Skipped for size - they are hundreds of
          # MB of Windows .obj/.pdb that the Linux build has no use for - and
          # for correctness: a Windows build running at the same time is
          # actively writing them, and flatpak-builder aborts with
          # "Error opening file .../aae_core.pdb: Permission denied" when it
          # tries to copy a file MSBuild has open. All three are gitignored
          # build products, not sources.
          - aae/x64
          - aae/aae/x64
          - aae/aae_core
          - aae_2026_7_20_release_1.7
          - dice.0.9.win.x86
          - dice.0.9.win.x86.zip
          - gifsicle-1.95-win64.zip
          - romident
          - images
    build-commands:
      # Explicit rather than buildsystem: cmake-ninja, for two reasons. The
      # default runs `ninja` with no target, which would also build
      # aae_audiotest - and that hard-errors when ALSA is absent, failing the
      # whole package over a target we do not ship. And CMakeLists defines no
      # install() rules, so the default `ninja install` would be a no-op that
      # merely looks like it worked.
      # CMAKE_PREFIX_PATH=/app is required, not decorative. The glu and glew
      # modules install there, and while the SDK compiler searches /app/include
      # by default - so everything COMPILES - CMake's find_package(GLEW) does
      # not, and GLEW is optional in CMakeLists. The result was a configure that
      # printed "Could NOT find GLEW", built all 139 objects happily, and then
      # failed at link with 200 undefined __glew* symbols.
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/app
      # env -u SOURCE_DATE_EPOCH: flatpak-builder pins that variable to the
      # MANIFEST's mtime for reproducible builds, and GCC substitutes it into
      # __DATE__/__TIME__ - so the startup banner's "built ..." stamp froze at
      # whenever this file was last edited and stopped identifying builds.
      # Two rebuilds hours apart shipped byte-identical banners, which cost a
      # debugging session spent proving a new binary was actually installed.
      # The banner is this project's build fingerprint; unpinning only this
      # compile step makes it honest again. (ccache does not cache __TIME__
      # users by default, so linux_main.cpp genuinely recompiles each build.)
      - env -u SOURCE_DATE_EPOCH cmake --build build --target aae
      # aae_inputtest: the input-stack diagnostic. Shipped deliberately, even
      # though it is a developer tool and not the entry point.
      #
      # SteamOS is an immutable image with no toolchain, so anything not built
      # here cannot be built later on the machine. Without this, the only way
      # to answer "do the keyboard LEDs work in the sandbox" is to launch a
      # game and watch, and the only way to see WHY they do not is to read a
      # log after the fact. It links the evdev backend but not aae_core, so it
      # costs a handful of translation units.
      #
      #   flatpak run --command=aae_inputtest io.github.tcottrill.AAE --leds
      - cmake --build build --target aae_inputtest
    post-install:
      # CMakeLists puts the executable in x64/Release beside its data; the
      # Flatpak layout wants it in /app/bin with the data under /app/share.
      - install -Dm755 x64/Release/aae /app/bin/aae
      # aae_inputtest has no RUNTIME_OUTPUT_DIRECTORY override, so unlike aae
      # it lands in the build directory rather than x64/Release.
      - install -Dm755 build/aae_inputtest /app/bin/aae_inputtest
      # Vulkan shaders (Phase 4b). If the SDK provides glslc, the cmake build
      # above compiled shaders/vk/*.spv next to the binary - install them.
      # If it does not, this is a quiet no-op and the aae-data module's
      # fallback (the prebuilt SPIR-V from the shared Windows output tree -
      # SPIR-V is platform-independent) covers it; a hard existence check
      # there guarantees the package can never ship renderer=vulkan (the
      # default) with no shaders at all.
      - mkdir -p /app/share/aae
      - if [ -d x64/Release/shaders ]; then cp -r x64/Release/shaders /app/share/aae/;
        fi
      # The Xbox guide lives in the repo root and has never been copied into
      # x64/Release, so it is installed from this module rather than aae-data
      # with the other three documents.
      - install -Dm644 "AAE Xbox Controller Guide.txt" "/app/share/aae/AAE Xbox Controller Guide.txt"
      - install -Dm755 packaging/flatpak/aae-launcher.sh /app/bin/aae-launcher.sh
      - install -Dm644 packaging/flatpak/io.github.tcottrill.AAE.desktop
          /app/share/applications/io.github.tcottrill.AAE.desktop
      - install -Dm644 packaging/flatpak/io.github.tcottrill.AAE.metainfo.xml
          /app/share/metainfo/io.github.tcottrill.AAE.metainfo.xml
      # Without an icon, appstreamcli fails the build outright with
      # "icon-not-found" - the metainfo file makes it a hard requirement, not a
      # cosmetic one. This is the 256x256 entry extracted from the Windows
      # aae/aae.ico, which already ships 16 through 256.
      - install -Dm644 packaging/flatpak/io.github.tcottrill.AAE.png
          /app/share/icons/hicolor/256x256/apps/io.github.tcottrill.AAE.png

  # Data ships as its own module so it is obvious what would have to be
  # removed to make this redistributable, and so a data-only change does not
  # force a rebuild of the emulator.
  - name: aae-data
    buildsystem: simple
    sources:
      - type: dir
        path: ../../x64/Release
        dest: aaedata
        # x64/Release is the shared Windows+Linux output directory, so it also
        # holds both platforms' binaries, PDBs, release zips and old docs.
        # Only the game data belongs in the package.
        skip:
          - aae
          - aae.exe
          - aae_win7.exe
          - aae.pdb
          - aae_core.lib
          - aae_core.pdb
          - xaudio2_9redist.dll
          - xaudio2_9redist.pdb
          - xapobaseredist.pdb
          - aae_win7_7_8_26.zip
          - aae.ini.bak
          - systemlog.txt
          - audiotest.log
          - original docs from 2007
          - hi
          # cfg/ is NOT skipped: two files in it are shipped as defaults (see
          # the seed step below). The other ~100 are the developer's own
          # per-game bindings and are deliberately not installed.
          # snap/ is where the screenshot key WRITES, so it is user state in
          # exactly the way hi/ and cfg/ are - the launcher creates it writable
          # under $XDG_DATA_HOME. Shipping it also meant shipping whatever
          # screenshots happened to be in the dev tree: 13MB of them last
          # build, a quarter of the whole bundle.
          - snap
    build-commands:
      - mkdir -p /app/share/aae
      - cp -r aaedata/roms    /app/share/aae/ 2>/dev/null || true
      - cp -r aaedata/artwork /app/share/aae/ 2>/dev/null || true
      - cp -r aaedata/samples /app/share/aae/ 2>/dev/null || true
      - cp -r aaedata/ini     /app/share/aae/ 2>/dev/null || true
      # pleiads/ is copied by EXTENSION rather than wholesale. The directory in
      # the tree is half reference material - a 2.6MB photo of the PCB and the
      # SVM7910E datasheet - which is worth keeping in the repo and pointless
      # inside /app, where nobody can find it. Only the melody/effect samples
      # the driver actually plays are runtime data.
      - mkdir -p /app/share/aae/pleiads
      - cp aaedata/pleiads/*.wav /app/share/aae/pleiads/ 2>/dev/null || true
      - cp aaedata/pleiads/readme.txt /app/share/aae/pleiads/ 2>/dev/null || true
      # Vulkan SPIR-V fallback (Phase 4b): the shared output tree carries the
      # Windows-compiled .spv, and SPIR-V is platform-independent. -n so the
      # SDK-built copies installed by the aae module (when glslc exists there)
      # are never clobbered by these.
      - if [ -d aaedata/shaders ]; then mkdir -p /app/share/aae/shaders/vk;
        cp -n aaedata/shaders/vk/*.spv /app/share/aae/shaders/vk/ 2>/dev/null || true;
        fi
      # HARD check - fail the package rather than ship renderer=vulkan (the
      # default) with no shader anywhere. fast_poly is the raster workhorse;
      # if it is missing they all are.
      - test -f /app/share/aae/shaders/vk/fast_poly_vk.vert.spv
      # Seed key bindings. inptport.cpp loads cfg/default.cfg for the global
      # map and cfg/<game>.cfg per game, and with neither present on a first
      # launch the GUI has no input mapping at all - the game list scrolls by
      # itself until a key is pressed, which reads as a broken build rather
      # than a missing file.
      #
      # ONLY these two. The rest of x64/Release/cfg is the developer's own
      # per-game bindings; shipping those would silently impose one person's
      # control layout on every install.
      - install -Dm644 aaedata/cfg/default.cfg /app/share/aae/cfg/default.cfg
      - install -Dm644 aaedata/cfg/gui.cfg     /app/share/aae/cfg/gui.cfg
      - install -Dm644 aaedata/aae.ini   /app/share/aae/aae.ini
      - install -Dm644 aaedata/video.ini /app/share/aae/video.ini
      # Shipped documentation, linked beside aae.ini by the launcher so it
      # sits with the settings it describes. "AAE Xbox Controller Guide.txt"
      # is NOT here - it exists only in the repo root, so the aae module
      # installs that one.
      - install -Dm644 aaedata/CREDIT.TXT /app/share/aae/CREDIT.TXT
      - install -Dm644 "aaedata/AAE Command Line Options.txt" "/app/share/aae/AAE Command Line Options.txt"
      - install -Dm644 "aaedata/AAE Configuration Options.txt" "/app/share/aae/AAE Configuration Options.txt"
